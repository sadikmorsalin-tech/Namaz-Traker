  --bg:#F7FAF9;--card:#fff;--text:#16302D;--mute:#6B817E;--line:#E1EDEB;
  --red:#E5484D;--redt:#FDECEC;--amber:#E39A07;--ambert:#FFF3D9;--gray:#EEF3F2;
  --sh:0 2px 12px rgba(20,70,64,.08);
  --amt:var(--amt);--dot:#D8E4E2;--dis:#BFD6D3;--h1:#1DC4B2;--h2:#14A99A;--sw:#CBD8D6;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D1716;--card:#162523;--text:#E7F3F1;--mute:#8FA9A5;--line:#263B38;--gray:#1F322F;
  --ptint:#123A34;--pd:#4FE3D2;--redt:#3B1F21;--red:#FF6B70;--ambert:#3B2F12;--amber:#F2A91F;
  --sh:0 2px 12px rgba(0,0,0,.4);--amt:#F5BE55;--dot:#2E4643;--dis:#2B3F3C;--h1:#0E8A7D;--h2:#0A6F65;--sw:#3A524F;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px;background:var(--bg)}
button{font-family:inherit}
/* header */
.hdr{background:linear-gradient(180deg,var(--h1) 0%,var(--h2) 100%);color:#fff;padding:14px 16px 20px;text-align:center}
.hdr .ttl{font-size:21px;font-weight:700;padding:6px 0 2px}
.hdr .bism{font-family:'Amiri',serif;font-size:20px;opacity:.95;line-height:1.1}
.hnav{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.hnav .mid{flex:1}
.hnav .mid b{display:block;font-size:16.5px;font-weight:600}
.hnav .mid small{opacity:.9;font-size:13px}
.hb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:22px;cursor:pointer}
.hb:disabled{opacity:.35;cursor:default}
.ring{position:relative;width:150px;height:150px;margin:8px auto 4px}
.ring svg{display:block}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:34px;line-height:1.1}
.ring .in span{font-size:13px;opacity:.95}
.gotoday{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:99px;padding:6px 16px;font-size:13.5px;cursor:pointer;margin-top:6px}
.body{padding:16px}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sc{background:var(--card);border-radius:20px;padding:14px 6px 12px;text-align:center;box-shadow:var(--sh)}
.sc svg{width:26px;height:26px;margin-bottom:4px}
.sc b{display:block;font-size:22px;line-height:1.2}
.sc span{font-size:12.5px;color:var(--mute)}
.sec{font-size:17px;font-weight:700;margin:6px 2px 10px}
/* prayer card */
.pc{background:var(--card);border-radius:20px;padding:14px 14px 14px 16px;margin-bottom:12px;box-shadow:var(--sh);border-left:6px solid #CFE3E0;transition:.15s}
.pc.p{border-left-color:var(--p)}.pc.q{border-left-color:var(--red)}.pc.m{border-left-color:var(--amber)}
.pt{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pt .ar{font-family:'Amiri',serif;font-size:26px;line-height:1.1}
.pt .bn{color:var(--mute);font-size:14.5px}
.chip{font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--gray);color:var(--mute)}
.pc.p .chip{background:var(--ptint);color:var(--pd)}
.pc.q .chip{background:var(--redt);color:var(--red)}
.pc.m .chip{background:var(--ambert);color:var(--amt)}
.pb{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:99px;border:0;font-size:15.5px;font-weight:600;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.ok{flex:1.6;background:var(--ptint);color:var(--pd)}
.btn.ok.on{background:var(--p);color:#fff;box-shadow:0 4px 12px rgba(29,196,178,.4)}
.btn.qz{background:var(--redt);color:var(--red)}
.btn.qz.on{background:var(--red);color:#fff}
.btn.qz.on.mm{background:#F6D6D6;color:#9a2d31}
.btn.pd{background:var(--ambert);color:var(--amt)}
.btn.pd.on{background:var(--amber);color:#fff}
.dash{width:100%;min-height:48px;border-radius:16px;border:1.5px dashed var(--p);background:transparent;color:var(--pd);font-size:15.5px;font-weight:600;cursor:pointer;margin-top:2px}

/* compact day screen */
.hdr.cmp{padding:10px 12px 14px;text-align:center}
.hdr.cmp .hnav{margin:0 0 10px}
.hdr.cmp .hb{width:40px;height:40px;font-size:20px}
.hdr.cmp .mid b{font-size:17px}
.hdr.cmp .mid small{font-size:12.5px}
.seg5{display:flex;gap:5px;margin:0 4px}
.seg5 i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.32)}
.seg5 i.on{background:#fff}
.prog{font-size:13.5px;margin-top:8px;opacity:.97}
.mini{display:flex;background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:14px;padding:10px 4px}
.mini div{flex:1;text-align:center;border-right:1px solid var(--line)}
.mini div:last-child{border:0}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini span{font-size:12px;color:var(--mute)}
.row5{background:var(--card);border-radius:18px;padding:10px 10px 10px 14px;margin-bottom:9px;box-shadow:var(--sh);border-left:5px solid #CFE3E0;display:flex;align-items:center;gap:8px}
.row5.p{border-left-color:var(--p)}.row5.q{border-left-color:var(--red)}.row5.m{border-left-color:var(--amber)}
.row5 .nm{flex:1;min-width:0}
.row5 .nm b{display:block;font-size:17px;line-height:1.2}
.row5 .nm small{font-size:12.5px;color:var(--mute)}
.row5.p .nm small{color:var(--pd)}.row5.q .nm small{color:var(--red)}.row5.m .nm small{color:var(--amt)}
.row5 .bt{display:flex;gap:6px;flex:none}
.row5 .btn{flex:none;min-height:44px;padding:0 14px;font-size:14.5px}
.row5 .btn.ok{min-width:78px}
/* calendar */
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cnav b{font-size:18px;color:var(--pd)}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:var(--gray);color:var(--text);font-size:20px;cursor:pointer}
.cb:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:12.5px;color:var(--mute);text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.1;border-radius:12px;border:2px solid transparent;background:transparent;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.cell.empty{cursor:default}
.cell.fut{opacity:.3}
.cell.tod{border-color:var(--p)}
.cell.sel{background:var(--ptint)}
.cell .n{font-size:15px;font-weight:600}
.dots{display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--dot)}
.dots i.p{background:var(--p)}.dots i.q{background:var(--red)}.dots i.m{background:var(--amber)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--mute);margin:12px 0 4px;flex-wrap:wrap}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--dot)}
.legend .lp:before{background:var(--p)}.legend .lq:before{background:var(--red)}.legend .lm:before{background:var(--amber)}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ic{background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;box-shadow:var(--sh)}
.ic svg{width:30px;height:30px}
.ic b{display:block;font-size:26px;margin:2px 0}
.ic span{color:var(--mute);font-size:14px}
/* list */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chp{background:var(--card);border-radius:99px;padding:5px 14px;font-size:14px;box-shadow:var(--sh)}
.chp b{color:var(--red)}
.mg{background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;min-height:56px}
.mh b{font-size:16.5px;display:block}
.mh small{color:var(--mute);font-size:13px}
.mh .cnt{font-size:22px;font-weight:700;color:var(--red)}
.mact{padding:0 16px 14px}
.pill{border:1.5px solid var(--amber);background:transparent;color:var(--amt);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.pill.arm{background:var(--amber);color:#fff}
.dr{padding:10px 16px;border-top:1px solid var(--line)}
.dr .dt{font-size:14px;color:var(--mute);margin-bottom:6px;cursor:pointer}
.dr .bs{display:flex;gap:6px;flex-wrap:wrap}
.dr .bs button{border:0;background:var(--redt);color:var(--red);border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:40px}
.empty-msg{text-align:center;color:var(--mute);padding:40px 10px;font-size:16px}
.empty-msg .ar{font-family:'Amiri',serif;color:var(--pd);font-size:30px;display:block;margin-bottom:4px}
/* bulk */
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.sg{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;font-size:15.5px;font-weight:600;cursor:pointer;color:var(--text);min-height:48px}
.sg.on.q{background:var(--red);border-color:var(--red);color:#fff}
.sg.on.p{background:var(--p);border-color:var(--p);color:#fff}
.sg.on.m{background:var(--amber);border-color:var(--amber);color:#fff}
.sg.on.x{background:#5B6F6C;border-color:#5B6F6C;color:#fff}
.hint{font-size:13.5px;color:var(--mute);margin:4px 2px 16px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pr{border:1.5px solid var(--p);background:transparent;color:var(--pd);border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:40px}
.pr.on{background:var(--p);color:#fff}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dates label{font-size:13px;color:var(--mute);display:block}
.dates input{width:100%;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:8px 10px;font:inherit;font-size:15.5px;color:var(--text)}
.prs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pp{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--mute);min-height:42px}
.pp.on{background:var(--ptint);border-color:var(--p);color:var(--pd)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:14px;cursor:pointer;border:0;width:100%;text-align:left;font-size:14.5px;color:var(--text);min-height:52px}
.sw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--sw);position:relative;transition:.15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--p)}.sw.on i:after{left:21px}
.prev{background:var(--ptint);border-radius:20px;padding:16px;text-align:center;margin-bottom:14px}
.prev b{font-size:34px;color:var(--pd);display:block;line-height:1.2}
.prev span{font-size:14px;color:var(--mute)}
.go{width:100%;min-height:54px;border-radius:99px;border:0;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(29,196,178,.4)}
.go.arm{background:var(--red);box-shadow:0 6px 16px rgba(229,72,77,.35)}
.go:disabled{background:var(--dis);box-shadow:none;cursor:default}
.undo{width:100%;min-height:46px;margin-top:10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.bmsg{text-align:center;color:var(--pd);font-weight:600;margin-top:12px;font-size:15px;min-height:20px}
.backup{margin-top:22px}
.backup h4{margin:0 0 4px;font-size:15.5px}
.backup p{margin:0 0 8px;font-size:13px;color:var(--mute)}
.backup textarea{width:100%;height:70px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:12px;padding:8px;resize:vertical;font-family:ui-monospace,monospace}
.backup .row{display:flex;gap:8px;margin-top:8px}
.backup .row button{flex:1;min-height:46px;border-radius:99px;border:1.5px solid var(--p);background:transparent;color:var(--pd);font-size:15px;font-weight:600;cursor:pointer}
.msg{font-size:13px;color:var(--pd);margin-top:6px;min-height:18px}

/* balanced day rows */
.row5{display:grid;grid-template-columns:68px 1fr 1fr 1fr;gap:6px;align-items:center;padding:10px 10px 10px 12px}
.row5 .bt{display:contents}
.row5 .btn{width:100%;padding:0 2px;font-size:13.5px;min-height:46px}
.row5 .btn:disabled{opacity:.35;cursor:default}
.row5 .nm small{font-family:'Amiri',serif;font-size:16px;color:var(--mute)!important}
/* calendar modes */
.modes{display:flex;background:var(--gray);border-radius:99px;padding:4px;margin-bottom:12px}
.md{flex:1;border:0;background:transparent;border-radius:99px;padding:10px 6px;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer;min-height:44px}
.md.on{background:var(--p);color:#fff;box-shadow:0 3px 10px rgba(29,196,178,.35)}
.nv{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nv select{flex:1;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:16px;font-weight:600;color:var(--pd);text-align:center;text-align-last:center;padding:0 8px}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.cell.rng{background:var(--ptint);border-radius:6px}
.cell.rs{background:var(--p);color:#fff;border-radius:12px}
.cell.rs .dots i{background:rgba(255,255,255,.55)}
.rsum{background:var(--ptint);border-radius:16px;padding:10px 14px;margin:10px 0 4px;font-size:14.5px;line-height:1.5}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:10}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;padding:9px 2px 10px;color:#7C8E8B;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:60px}
.nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pd);font-weight:700}

/* header v3 */
.hdr.cmp{padding:14px 14px 22px}
.hdr.cmp .hnav{margin:2px 0 16px}
.hdr.cmp .hb{width:44px;height:44px;font-size:22px}
.hdr.cmp .mid b{font-size:18px}
.hdr.cmp .mid small{font-size:13.5px}
.seg5{gap:6px}
.seg5 i{height:11px}
.prog{font-size:15px;margin-top:10px;font-weight:600}
.trow{display:flex;align-items:center;justify-content:space-between;padding:0 0 12px}
.trow .sp{width:64px}
.trow .ttl{flex:1;padding:0;font-size:21px;font-weight:700}
.tsw{width:64px;height:36px;border-radius:99px;border:0;background:rgba(255,255,255,.3);position:relative;cursor:pointer;padding:0;flex:none}
.tsw .kn{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;color:#0A6F65;display:flex;align-items:center;justify-content:center;transition:left .18s}
.tsw .kn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tsw.on{background:rgba(0,0,0,.35)}
.tsw.on .kn{left:31px}
.nav .in{grid-template-columns:repeat(3,1fr)}

/* v4 grid + paint */
.md{font-size:14.5px;padding:10px 2px}
.gt{display:grid;grid-template-columns:50px repeat(5,1fr) 38px;gap:5px;align-items:center;margin-top:6px}
.gh{font-size:12px;font-weight:700;color:var(--pd);background:var(--ptint);border:0;border-radius:10px;min-height:36px;cursor:pointer;padding:0 1px}
.gm{font-size:13.5px;font-weight:600;background:transparent;border:0;text-align:left;color:var(--text);min-height:42px;cursor:pointer;padding:0}
.gc{min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:13.5px;font-weight:700;color:var(--mute);cursor:pointer;padding:0}
.gc.full{background:var(--red);border-color:var(--red);color:#fff}
.gc.part{background:var(--redt);border-color:var(--red);color:var(--red)}
.gc.ok{background:var(--ptint);border-color:var(--p);color:var(--pd)}
.gc.fut{opacity:.25;cursor:default}
.yt{display:flex;align-items:center;justify-content:space-between;background:var(--redt);border-radius:14px;padding:10px 14px;margin:4px 0 10px;font-size:14.5px}
.yt b{color:var(--red);font-size:20px}
.cell.pk{background:var(--redt)}

/* v5: only kaja / adai */
.row5{grid-template-columns:70px 1fr 1fr}
.row5 .btn{font-size:15px}
.seg5 i.q{background:#FF9A9A}
.seg5 i.m{background:#FFD27A}

.trow .sp{display:flex;align-items:center}
.appic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.appic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <div id="hdr"></div>
  <main id="view" class="body"></main>
</div>
<nav class="nav"><div class="in" id="nav"></div></nav>

<script>
(function(){
const PR=[
  {k:'fajr',bn:'ফজর',ar:'الفجر'},
  {k:'dhuhr',bn:'যোহর',ar:'الظهر'},
  {k:'asr',bn:'আসর',ar:'العصر'},
  {k:'maghrib',bn:'মাগরিব',ar:'المغرب'},
  {k:'isha',bn:'এশা',ar:'العشاء'}
];
const WD=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
const LS='namaj-tracker-v1';
const bd=s=>String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtLong=k=>{try{return parse(k).toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return k}};
const fmtShort=k=>{try{return parse(k).toLocaleDateString('bn-BD',{weekday:'short',day:'numeric',month:'short'})}catch(e){return k}};
const fmtMonth=(y,m)=>{try{return new Date(y,m,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}catch(e){return y+'-'+(m+1)}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const IC={
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  day:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

/* ---------- storage ---------- */
function stripP(){

    if(!Object.keys(data[dk]).length)delete data[dk];

let dbDoc=null,dbReady=false,saveTimer=null;

function pushDb(){
  if(!dbDoc||!dbReady)return;
  clearTimeout(saveTimer);

}
function save(){

}
const okDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=todayK&&!isNaN(parse(v));

}

async function initDb(){
  try{
    if(!(window.claude&&claude.use))return;
    const db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user)return;
    const id=await user.id();
    dbDoc=db.collection('data/users/'+id).doc('namaj');
    const snap=await dbDoc.get();
    dbReady=true;
    let d=snap;
    if(snap&&typeof snap.data==='function')d=snap.data();
    else if(snap&&snap.data!==undefined)d=snap.data;
    if(d&&!hadLocalLast&&okDate(d.last)&&cur===todayK){cur=d.last;lastSavedCur=cur;render()}
    if(d&&d.records&&(d.t||0)>stamp){data=d.records;stamp=d.t;stripP();
      try{localStorage.setItem(LS,JSON.stringify({records:data,t:stamp}))}catch(e){}
      render();
    }else if(Object.keys(data).length){
      dbDoc.set({records:data,t:stamp});
    }
  }catch(e){}
}

/* ---------- logic ---------- */
function setSt(dk,pk,val){
  if(!data[dk])data[dk]={};
  if(val==null)delete data[dk][pk];else data[dk][pk]=val;
  if(!Object.keys(data[dk]).length)delete data[dk];
  save();render();
}
function counts(){
  let q=0,m=0;
  for(const dk in data)for(const k in data[dk]){if(data[dk][k]==='q')q++;else if(data[dk][k]==='m')m++}
  return {q,m};
}
function monthDays(y,m){const o=[],dim=new Date(y,m+1,0).getDate();for(let d=1;d<=dim;d++){const dk=y+'-'+pad(m+1)+'-'+pad(d);if(dk<=todayK)o.push(dk)}return o}
function yearDays(y){let o=[];for(let m=0;m<12;m++)o=o.concat(monthDays(y,m));return o}
function statOf(list,ks){
  let free=0,q=0,blk=0;
  for(const dk of list){const r=data[dk]||{};for(const k of ks){const s=r[k];if(!s)free++;else if(s==='q')q++;else blk++}}
  return {free,q,blk};
}
function toggleQ(list,ks){
  const st=statOf(list,ks);
  if(!st.free&&!st.q){tmsg='এগুলো আগে থেকেই আদায় হিসেবে মার্ক করা আছে';render();return}
  undoSnap=JSON.stringify(data);
  const setMode=st.free>0;
  for(const dk of list)for(const k of ks){
    const s=(data[dk]||{})[k];
    if(setMode&&!s){(data[dk]=data[dk]||{})[k]='q'}
    else if(!setMode&&s==='q'){delete data[dk][k];if(!Object.keys(data[dk]).length)delete data[dk]}
  }
  tmsg=setMode?bd(st.free)+' ওয়াক্ত কাজা মার্ক হয়েছে ✓':bd(st.q)+' ওয়াক্তের কাজা মুছে গেছে';
  save();render();
}

const monthName=m=>{try{return new Date(2000,m,1).toLocaleDateString('bn-BD',{month:'long'})}catch(e){return m+1}};

function gridHtml(){

}
function calView(){

  document.getElementById('hdr').innerHTML=headerHtml();
  document.getElementById('nav').innerHTML=navHtml();
  document.getElementById('view').innerHTML=tab==='day'?dayView():tab==='cal'?calView():listView();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-theme-toggle],[data-tab],[data-nav],[data-goto],[data-set],[data-all],[data-cal],[data-bk],[data-exp],[data-mpaid],[data-cmode],[data-cyear],[data-ppr],[data-pday],[data-gcell],[data-grow],[data-gcol],[data-gall],[data-gmon],[data-undo]');
  if(!t)return;
  const d=t.dataset;
  if(d.themeToggle){
    theme=theme==='dark'?'light':'dark';applyTheme();
    try{localStorage.setItem('namaj-theme',theme)}catch(x){}
    render();
  }else if(d.tab){
    tab=d.tab;restoreArmed=false;backupMsg='';armedMonth=null;tmsg='';undoSnap=null;
    if(tab==='cal'){const x=parse(cur);calY=x.getFullYear();calM=x.getMonth()}
    render();window.scrollTo(0,0);
  }else if(d.nav){
    const x=parse(cur);x.setDate(x.getDate()+Number(d.nav));
    const k=keyOf(x);if(k<=todayK){cur=k;render()}
  }else if(d.goto){
    cur=d.goto;tab='day';render();window.scrollTo(0,0);
  }else if(d.set){
    const dk=d.date||cur,pk=d.set,v=d.v;
    const s=(data[dk]||{})[pk];
    if(v==='q')setSt(dk,pk,(s==='q'||s==='m')?null:'q');
    else if(v==='m')setSt(dk,pk,s==='m'?'q':'m');
  }else if(d.all){
    const rec=data[cur]||{};
    const hasFree=PR.some(p=>!rec[p.k]);
    if(hasFree){PR.forEach(p=>{if(!rec[p.k]){(data[cur]=data[cur]||{})[p.k]='q'}})}
    else{PR.forEach(p=>{if(rec[p.k]==='q')delete data[cur][p.k]});if(!Object.keys(data[cur]||{}).length)delete data[cur]}
    save();render();
  }else if(d.cal){
    calM+=Number(d.cal);
    if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}
    clampCal();render();
  }else if(d.exp){
    if(exp.has(d.exp))exp.delete(d.exp);else exp.add(d.exp);render();
  }else if(d.mpaid){
    if(armedMonth!==d.mpaid){armedMonth=d.mpaid;render();return}
    for(const dk in data)if(dk.startsWith(d.mpaid))for(const k in data[dk])if(data[dk][k]==='q')data[dk][k]='m';
    armedMonth=null;save();render();
  }else if(d.cmode){
    calMode=d.cmode;tmsg='';undoSnap=null;render();
  }else if(d.cyear){
    calY+=Number(d.cyear);clampCal();render();
  }else if(d.ppr){
    paint[d.ppr]=paint[d.ppr]?0:1;tmsg='';render();
  }else if(d.pday){
    const ks=ALLK.filter(k=>paint[k]);
    if(!ks.length){tmsg='আগে অন্তত একটা ওয়াক্ত বাছো';render();return}
    toggleQ([d.pday],ks);
  }else if(d.gcell){
    const [m,k]=d.gcell.split(':');toggleQ(monthDays(calY,Number(m)),[k]);
  }else if(d.grow){
    toggleQ(monthDays(calY,Number(d.grow)),ALLK);
  }else if(d.gcol){
    toggleQ(yearDays(calY),[d.gcol]);
  }else if(d.gall){
    toggleQ(yearDays(calY),ALLK);
  }else if(d.gmon){
    calM=Number(d.gmon);calMode='view';tmsg='';render();
  }else if(d.undo){
    try{data=JSON.parse(undoSnap);save();tmsg='আগের অবস্থায় ফেরানো হয়েছে ✓'}catch(x){tmsg='ফেরানো যায়নি'}
    undoSnap=null;render();
  }else if(d.bk==='copy'){
    const ta=document.getElementById('bk');ta.select();
    let ok=false;
    try{navigator.clipboard.writeText(ta.value).then(()=>{backupMsg='কপি হয়েছে ✓';render()},()=>{backupMsg='লেখাটা সিলেক্ট হয়েছে, নিজে কপি করো';render()});ok=true}catch(x){}
    if(!ok){backupMsg='লেখাটা সিলেক্ট হয়েছে, নিজে কপি করো';render()}
  }else if(d.bk==='restore'){
    if(!restoreArmed){restoreArmed=true;backupMsg='সতর্কতা: এতে বর্তমান ডাটা বদলে যাবে';render();return}
    try{
      const o=JSON.parse(document.getElementById('bk').value);
      if(!o||typeof o.records!=='object')throw 0;
      data=o.records;save();backupMsg='রিস্টোর হয়েছে ✓';
    }catch(x){backupMsg='লেখাটা ঠিক নেই, রিস্টোর হয়নি'}
    restoreArmed=false;render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='calMonth'){calM=Number(t.value);clampCal();render()}
  else if(t.id==='calYear'){calY=Number(t.value);clampCal();render()}
});

loadLocal();
restoreLast();
lastSavedCur=cur;
render();
initDb();
setInterval(()=>{const k=keyOf(new Date());if(k!==todayK){const was=cur===todayK;todayK=k;if(was)cur=k;render()}},60000);
})();
</script>
</body>
</html>
